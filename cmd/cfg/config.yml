loglevel: trace
telemetry:
  enabled: true
  ws_url: ws://127.0.0.1:3000/ws
logging:
  logfile: false
  trace:
    path: ''
  elasticsearch:
    enabled: true
    urls:
    - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    password: ''
    api_key: ''
    ca_cert: ''
    insecure_skip_verify: true
system:
  projectRoot: /Users/theapemachine/go/src/github.com/theapemachine/six
  batchSize: 10000
  batchWindow: 500
  queueSize: 20000
  shannonLimit: 0.47
  resonanceThreshold: 0.6
  beliefEpsilon: 0.05
  routeBudget: 64
  maxMembersPerField: 256
  quiescenceTimeout: 100ms
  drainTimeout: 100ms
value:
  word: 64
  words: 128
  bytes: 1024
  num_rotations: 16
  region:
    tokens:
      start: 0
      bits: 1024
    program:
      start: 16
      bits: 1024
    signals:
      start: 32
      bits: 512
    context:
      start: 40
      bits: 512
    gradient:
      start: 48
      bits: 512
    properties:
      start: 56
      bits: 1024
    asset:
      start: 72
      bits: 3072
    prev:
      start: 120
      bits: 64
    next:
      start: 121
      bits: 64
    id:
      start: 122
      bits: 64
    affinity:
      start: 123
      bits: 257
  opcodes:
    false: 0
    and: 1
    aandnotb: 8
    a: 9
    notandb: 64
    b: 65
    xor: 72
    or: 73
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111
  properties:
    - LABELS
    - CONFIDENCE
    - EPOCH
    - TTL
    - TEMPERATURE
    - STATUS
    - NOISE
    - PROGRAM_ID
    - COMMUNITY
    - TARGET
    - ROLE
    - REFERENCE
    - SURPRISAL
    - PREV_SURPRISAL
    - DELTA_SURPRISAL
    - STUCK_COUNT
    - FALSIFIED
    - STUCK
    - CONTINUATION
  roles:
    - None
    - Programmer
    - Learner
    - Readout
    - Association
    - Prompt
  status:
    - PENDING
    - READY
    - BUSY
    - WAITING
    - DONE
    - RESOLVED
    - ERROR
programs:
  link: '[ (prev[0,1] self) <= (asset[0,1] | asset[0,1]) <= community ]

    [ (next[0,1] self) <= (asset[1,1] | asset[1,1]) <= community ]

    [ (properties.continuation self) <= (id[0,1]) <= community ]

    '
  affinity: '[ (affinity[0,5] self) <= (tokens[0,16] ^ tokens[0,16]) <= community
    ]

    '
  structural_component: |
    [ (signals[0,8] self) <= (tokens[0,8] ^ tokens[8,8]) <= community ]
    [ (properties.continuation self) <= (properties.continuation B 2) ? (properties.role != 0) <= community ]
    [ (properties.role self) <= (properties.role B 3) <= community ]
  popcount: '[ (affinity[4,1] self) <= popcnt(affinity[0,5]) <= community
    ]

    '
  coupling: '[ (signals[0,1] self) <= popcnt(tokens[0,16] & affinity[0,5]) <= community
    ]

    [ (signals[1,1] self) <= popcnt(tokens[0,16] | affinity[0,5]) <= community ]

    '
  beam_swarm_step: '[ (context[0,8] self) <= (tokens[0,8] ^ gradient[0,8]) <= community
    ]

    [ (signals[0,8] self) <= (tokens[0,8] ^ context[0,8]) <= community ]

    [ (properties.falsified self) <= popcnt(signals[0,8]) <= community
    ]

    [ (properties.falsified self) <= (properties.falsified | properties.confidence) <= community
    ]

    [ (affinity[0,5] self) <= (properties.falsified ^ affinity[0,5]) <= community ]

    [ (gradient[0,8] self) <= (signals[0,8] ^ gradient[0,8]) <= community ]

    [ (properties.continuation self) <= (id[0,1]) <= community ]

    '
  surprisal: '[ (signals[0,8] self) <= (tokens[0,8] ^ context[0,8]) <= community ]

    [ (properties.falsified self) <= popcnt(signals[0,8]) <= community
    ]

    [ (gradient[0,8] self) <= (signals[0,8] ^ gradient[0,8]) <= community ]

    [ (properties.continuation self) <= (id[0,1]) <= community ]

    '
  hypothesis: '[ (signals[0,8] self) <= (context[0,8] ^ gradient[0,8]) <= community
    ]

    [ (properties.confidence self) <= popcnt(signals[0,8]) <= community ]

    [ (properties.confidence self) <= (id[0,1] | id[0,1]) <= community ]

    '
  memory_prune: |
    [ (properties.confidence self) <= (properties.confidence | 1) ? (properties.status != 0) <= community ]
    [ (properties.confidence self) <= (properties.confidence \ 1) ? (properties.falsified != 0) <= community ]
    
    [ (properties.ttl self) <= (properties.ttl \ 1) ? (properties.confidence == 0) <= community ]
    
    [ (properties.continuation self) <= (0) ? (properties.ttl == 0) <= community ]
    [ (properties.continuation self) <= (id[0,1]) ? (properties.ttl != 0) <= community ]
  temperature: |
    [ (affinity[0,5] self) <= (properties.temperature ^ affinity[0,5]) <= community ]
    
    [ (properties.temperature self) <= (properties.temperature | 1) ? (properties.delta_surprisal == 0) <= community ]
    [ (properties.ttl self) <= (properties.ttl \ 1) ? (properties.temperature != 0) <= community ]
    
    [ (properties.continuation self) <= (0) ? (properties.ttl == 0) <= community ]
    [ (properties.continuation self) <= (id[0,1]) ? (properties.ttl != 0) <= community ]
  active_inference: |
    [ (signals[0,8] self) <= (tokens[0,8] ^ context[0,8]) <= community ]
    [ (properties.prev_surprisal self) <= (properties.surprisal | 0) <= community ]
    [ (properties.surprisal self) <= popcnt(signals[0,8]) <= community ]
    
    [ (properties.delta_surprisal self) <= (properties.prev_surprisal ^ properties.surprisal) <= community ]
    
    [ (context[0,8] self) <= (context[0,8] ^ gradient[0,8]) <= community ]

    [ (properties.stuck_count self) <= (properties.stuck_count | 1) ? (properties.delta_surprisal == 0) <= community ]
    [ (properties.stuck_count self) <= (0) ? (properties.delta_surprisal != 0) <= community ]
    
    [ (properties.stuck self) <= (1) ? (properties.stuck_count != 0) <= community ]

    [ (properties.continuation self) <= (0) ? (properties.surprisal == 0) <= community ]
    [ (properties.status self) <= (properties.status B 5) ? (properties.surprisal == 0) <= community ]

    [ (properties.continuation self) <= (id[0,1]) ? (properties.surprisal != 0) <= community ]
  causal_explore: |
    [ (signals[0,8] self) <= (tokens[0,8] -> context[0,8]) <= community ]
    [ (properties.falsified self) <= any_zero(signals[0,8]) <= community ]
    [ (gradient[0,8] fold) <= (gradient[0,8] ^ context[0,8]) ? (properties.falsified != 0) <= community ]
    [ (properties.status self) <= (properties.status B 5) <= community ]
    [ (properties.continuation self) <= (0) <= community ]
  causal_hub: '[ (signals[0,8] self) <= (tokens[0,8] ^ context[0,8]) <= community
    ]

    [ (asset[40,8] self) <= (gradient[0,8] ^ context[0,8]) <= community ]

    [ (properties.falsified self) <= popcnt(signals[0,8]) <= community
    ]

    [ (properties.falsified self) <= (properties.falsified | properties.epoch) <= community
    ]

    [ (gradient[0,8] self) <= (asset[40,8] ^ gradient[0,8]) <= community ]

    [ (properties.continuation self) <= (id[0,1]) <= community ]

    '
  open_ended_generation: |
    ; 1. THE AFFINE ROTATION: Rotate the current token vectors toward the prompt's context.
    [ (tokens[0,16] self) <= (tokens[0,16] ^ asset[8,16]) <= community ]

    ; 2. THE BOOLEAN FILTER: Check if the mutated tokens break structural rules in Context.
    [ (properties.falsified self) <= any_zero(tokens[0,8] -> context[0,8]) <= community ]

    ; 3. THE CULLING: Halt the Value if it violates causal logic (falsified).
    [ (properties.continuation self) <= (0) ? (properties.falsified != 0) <= community ]

    ; 4. THE EMISSION: If the novel coordinate survived falsification, spawn it into the persistent sequence.
    [ (properties.target spawn) <= (0) ? (properties.falsified == 0) <= community ] '[ (signals[0,8] self) <= (context[0,8] ^ asset[8,8]) <= community
    ]

    [ (properties.confidence self) <= popcnt(signals[0,8]) <= community ]

    '
  survey_community: |
    [ (context[7,1] self) <= (context[6,1]) <= community ]
    [ (context[6,1] self) <= (context[5,1]) <= community ]
    [ (context[5,1] self) <= (context[4,1]) <= community ]
    [ (context[4,1] self) <= (context[3,1]) <= community ]
    [ (context[3,1] self) <= (context[2,1]) <= community ]
    [ (context[2,1] self) <= (context[1,1]) <= community ]
    [ (context[1,1] self) <= (context[0,1]) <= community ]
    [ (context[0,1] self) <= (asset[24,1]) <= community ]

    [ (properties.labels self) <= popcnt(context[0,8]) <= community ]

    [ (properties.status self) <= (properties.labels B 5) ? (properties.labels != 0) <= community ]

    [ (properties.continuation self) <= (0) ? (properties.labels != 0) <= community ]
    [ (properties.continuation self) <= (id[0,1]) ? (properties.labels == 0) <= community ]
  meta_controller: |
    [ (properties.continuation self) <= (properties.continuation B 4) ? (properties.falsified != 0) <= community ]
    [ (properties.continuation self) <= (properties.continuation B 5) ? (properties.stuck != 0) <= community ]
    [ (properties.continuation self) <= (properties.continuation B 6) ? (properties.surprisal == 0) <= community ]
    [ (properties.continuation self) <= (0) ? (properties.ttl == 0) <= community ]
    
    [ (properties.continuation self) <= (properties.continuation B 7) ? (properties.surprisal != 0) <= community ]
  classify_readout: '[ (signals[0,1] self) <= (properties.labels | properties.labels)
    <= community ]

    '
  episodic_replay: '[ (signals[0,8] self) <= (context[0,8] ^ asset[8,8]) <= community
    ]

    [ (properties.confidence self) <= popcnt(signals[0,8]) <= community ]

    '
  intervene: '[ (signals[0,8] self) <= (context[0,8] ^ asset[16,8]) <= community ]

    [ (properties.falsified self) <= popcnt(signals[0,8] | signals[0,8]) <= community
    ]

    [ (gradient[0,8] self) <= (asset[16,8] ^ gradient[0,8]) <= community ]

    '
  vote_swarm: |
    [ (context[0,8] self) <= (asset[0,8] ^ context[0,8]) <= community ]

    # 1. Copy peer label to host label if host label is 0
    # If hostLabel != 0, zero out the staged peerLabel
    [ (asset[24,1] self) <= (0) ? (properties.labels != 0) <= community ]
    # If peerLabel is still != 0, adopt it
    [ (properties.labels self) <= (asset[24,1] A 0) ? (asset[24,1] != 0) <= community ]

    # 2. If hostLabel != 0 AND ROLE == Prompt (5), promote to Readout
    # signals[1] = hostLabel
    [ (signals[1,1] self) <= (properties.labels) <= community ]
    # signals[2] = ROLE ^ 5 (0 if Prompt)
    [ (signals[2,1] self) <= (properties.role ^ 5) <= community ]
    # If ROLE != 5, zero out signals[1]
    [ (signals[1,1] self) <= (0) ? (signals[2,1] != 0) <= community ]

    # Now signals[1] is non-zero ONLY IF (hostLabel != 0 AND ROLE == 5)
    # Prepare constants and conditionally apply them

    # ROLE = 3 (Readout)
    [ (properties.role self) <= (properties.labels B 3) ? (signals[1,1] != 0) <= community ]

    # STATUS = 5 (RESOLVED)
    [ (properties.status self) <= (properties.labels B 5) ? (signals[1,1] != 0) <= community ]

    # EMIT = 1
    [ (properties.surprisal self) <= (properties.labels B 1) ? (signals[1,1] != 0) <= community ]

    # Stop looping by zeroing properties.continuation
    [ (properties.continuation self) <= (0) ? (signals[1,1] != 0) <= community ]

    [ (properties.continuation self) <= (id[0,1]) ? (signals[1,1] == 0) <= community ]
