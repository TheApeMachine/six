loglevel: trace
telemetry:
  enabled: true
  ws_url: ws://127.0.0.1:3000/ws
logging:
  logfile: false
  trace:
    path: ''
  elasticsearch:
    enabled: true
    urls:
    - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    password: ''
    api_key: ''
    ca_cert: ''
    insecure_skip_verify: true
system:
  projectRoot: /Users/theapemachine/go/src/github.com/theapemachine/six
  batchSize: 10000
  batchWindow: 500
  queueSize: 20000
  shannonLimit: 0.47
  resonanceThreshold: 0.6
  beliefEpsilon: 0.05
  routeBudget: 128
  maxMembersPerField: 256
  quiescenceTimeout: 100ms
  drainTimeout: 100ms
value:
  word: 64
  words: 128
  bytes: 1024
  num_rotations: 16
  region:
    tokens:
      start: 0
      bits: 1024
    program:
      start: 16
      bits: 1024
    signals:
      start: 32
      bits: 512
    context:
      start: 40
      bits: 512
    gradient:
      start: 48
      bits: 512
    properties:
      start: 56
      bits: 1024
    asset:
      start: 72
      bits: 3072
    prev:
      start: 120
      bits: 64
    next:
      start: 121
      bits: 64
    id:
      start: 122
      bits: 64
    affinity:
      start: 123
      bits: 257
  opcodes:
    false: 0
    and: 1
    aandnotb: 8
    a: 9
    notandb: 64
    b: 65
    xor: 72
    or: 73
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111
  properties:
    - LABELS
    - CONFIDENCE
    - EPOCH
    - TTL
    - TEMPERATURE
    - STATUS
    - NOISE
    - PROGRAM_ID
    - COMMUNITY
    - TARGET
    - ROLE
    - REFERENCE
    - SURPRISAL
    - PREV_SURPRISAL
    - DELTA_SURPRISAL
    - CONTINUATION
  roles:
    - None
    - Programmer
    - Learner
    - Readout
    - Association
    - Prompt
  status:
    - PENDING
    - READY
    - BUSY
    - WAITING
    - SELECTED
    - DONE
    - RESOLVED
    - ERROR
programs:
  query: |
    program query {
      ; Select the community. Each matching B is tagged SELECTED with its
      ; reference word pointing at A.properties.reference (the main value's
      ; id), so the host can group the selection by owner without any
      ; Go-side staging map: selection state lives entirely in the Values.
      gossip(B) {
        (B.{{A.context[0,1]}} == {{A.context[1,1]}}) {
          write B.properties.reference <- A.properties.reference
          set B.properties.status <- SELECTED

          (B.id == A.properties.reference) {
            set B.properties.status <- READY
          }
        }
      }

      set A.properties.status <- DONE
    }

  structural_component: |
    program structural_component {
      ; Keep cancel and merge witnesses in the 8-word signal lane so
      ; downstream readout can continue from in-band state.
      gossip(B) {
        write A.signals[0,4] <- xor(A.tokens[0,4], B.tokens[0,4])
        write A.signals[4,4] <- and(A.tokens[4,4], B.tokens[4,4])
      }

      set A.properties.status <- DONE
      set A.properties.continuation <- 0
    }

  structural_associate: |
    program structural_associate {
      gossip(B) {
        (A.properties.target == 0) {
          write A.signals[0,8] <- xor(A.tokens[0,8], B.tokens[0,8])
          set A.properties.confidence <- popcnt(A.signals[0,8])
          set A.properties.target <- B.id
          set A.next <- B.id
          set B.prev <- A.id
          set B.next <- A.id
        }
      }

      set A.properties.status <- DONE
      set A.properties.continuation <- 0
    }

  structural_readout: |
    program structural_readout {
      (A.prev == 0) {
        gossip(B) {
          (B.properties.role == Association) {
            write A.tokens <- or(A.tokens, B.tokens)
            write A.signals[0,8] <- xor(A.tokens[0,8], B.tokens[0,8])
            set A.properties.confidence <- popcnt(A.signals[0,8])
          }
        }

        set A.properties.status <- RESOLVED
      }

      (A.prev != 0) {
        set A.properties.status <- DONE
      }

      set A.properties.continuation <- 0
    }

  recruit_community: |
    program recruit_community {
      ; A sample head recruits only the Values in its linked sample chain.
      ; The chain reference is the head ID, so this stays an in-band
      ; community formation pass instead of a host-side classifier.
      gossip(B) {
        (B.properties.reference == A.id) {
          write A.affinity <- or(A.affinity, B.affinity)
          set B.properties.community <- A.id
          set B.properties.status <- DONE
        }
      }

      set A.properties.community <- A.id
      set A.properties.target <- A.id
      set A.properties.role <- Readout

      set A.properties.status <- DONE
      set A.properties.continuation <- 0
    }
  class_prototype: |
    program class_prototype {
      ; Class prototypes are no longer part of classification readout.
      ; Communities are sample-rooted by recruit_community and labels are
      ; read from resident Values in the selected community.
      set A.properties.status <- DONE
      set A.properties.continuation <- 0
    }
  classify_readout: |
    program classify_readout {
      ; The head Value owns readout. It ORs linked prompt affinities, matches
      ; the resulting article fingerprint to community roots, then reads the
      ; label from Values inside the selected community.
      set A.properties.prev_surprisal <- A.properties.surprisal
      set A.properties.status <- READY

      gossip(B) {
        (B.properties.reference == A.id) {
          write A.affinity <- or(A.affinity, B.affinity)
        }
      }

      gossip(B) {
        (B.properties.role == Readout) {
          write B.gradient[0,5] <- xor(A.affinity, B.affinity)
          set B.properties.delta_surprisal <- popcnt(B.gradient[0,5])

          (B.properties.delta_surprisal < A.properties.surprisal) {
            set A.properties.surprisal <- B.properties.delta_surprisal
            set A.properties.community <- B.properties.community
          }
        }
      }

      gossip(B) {
        (B.properties.community == A.properties.community) {
          set A.properties.labels <- B.properties.labels
        }
      }

      (A.properties.prev_surprisal == A.properties.surprisal) {
        set A.properties.status <- RESOLVED
      }

      (A.prev != 0) {
        set A.properties.status <- DONE
      }
    }
