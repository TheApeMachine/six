loglevel: debug

# UDP destination for experiment pipeline telemetry (Observer JSON + raw frames).
telemetry:
  enabled: true
  udp_endpoint: "127.0.0.1:8258"

# Logging and trace shipping (see pkg/errnie/logging_config.go).
logging:
  logfile: false
  trace:
    # Empty path writes to ./trace.log under the process working directory.
    path: ""
  elasticsearch:
    # Must be true for logs to ship. Or export ELASTICSEARCH_ENABLED=true.
    enabled: true
    urls:
      - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    # Leave empty and set ELASTIC_PASSWORD (e.g. from .env) for Docker stacks.
    password: ""
    # Base64 API key (optional); overrides username/password when set. Or ELASTICSEARCH_API_KEY.
    api_key: ""
    # PEM path to the cluster CA (e.g. Elasticsearch docker certs/ca/ca.crt).
    ca_cert: ""
    # Local development only when you cannot mount the CA.
    insecure_skip_verify: true
    # Low-latency shipping defaults are applied when these are omitted (near-real-time in Kibana).
    # bulk_flush_bytes: 1
    # flush_interval_ms: 50
    # bulk_refresh: "true"

system:
  projectRoot: "/Users/theapemachine/go/src/github.com/theapemachine/six"

numerics:
  words: 128
  corebits: 8191
  epsilon: 1e-9
  nsymbols: 256
  nbasis: 512

value:
  words: 128
  region:
    tokens:
      start: 0
      bits: 3648
    id:
      start: 57
      bits: 64
    prev:
      start: 58
      bits: 64
    next:
      start: 59
      bits: 64
    state: 
      index: 60
      sequence: 61
      accumulator: 62
    affinity:
      start: 63
      bits: 64
    registers:
      start: 64
      bits: 768
      r0: 64
      r1: 65
      r2: 66
      r3: 67
      r4: 68
      r5: 69
      r6: 70
      r7: 71
      r8: 72
      r9: 73
      fw: 74
      pc: 75
    pc:
      start: 75
      bits: 64
    program:
      start: 76
      bits: 3328
  opcodes:
    false: 0000
    and: 0001
    aandnotb: 0010
    a: 0011
    notandb: 0100
    b: 0101
    xor: 0110
    or: 0111
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111


# Substrate Firmware Programs
# Format: src dest gate (Reverse Polish Notation, 2-address)
#
# Operands:
#   number    = immediate value (0-16383)
#   rN        = register (r0-r9, pc, fw)
#
# Registers (triple model):
#   r0    = context A (0=self, 1=partner)
#   r1    = start A
#   r2    = end A
#   r3    = context B (0=self, 1=partner)
#   r4    = start B
#   r5    = end B
#   r6-r9 = scratch registers
#   fw    = firmware selector
#   pc    = program counter
#
# Gates: all 16 two-input boolean truth tables (0000-1111)
#   0000=FALSE  0001=AND   0010=A∧¬B  0011=A
#   0100=¬A∧B   0101=B     0110=XOR   0111=OR
#   1000=NOR    1001=XNOR  1010=¬B    1011=B→A
#   1100=¬A     1101=A→B   1110=NAND  1111=TRUE
#
# Control flow:
#   Directly manipulate the PC register (word 78) to branch.
#   Write a line number to PC to jump. 
#   Loop: Write target line to PC. Exit loop: Write currentpc + 1 to PC.

programs:
  # Learn evaluates fitness via Bitwise Overlap (A AND B).
  # If Success: triggers Viral (fw=3).
  # If Failure: Frustration++, if Frustration maxes out, triggers Tombstone (fw=2).
  learn: |
    0     r0  0011 # Self
    0     r1  0011 # Tokens start
    64    r2  0011 # Check first 64 bits for speed
    0     r3  0011 # Self
    4480  r4  0011 # r6 start
    4544  r5  0011 # r6 end
    r0    r3  0011 # COPY Self to r6

    1     r0  0011 # Partner
    0     r1  0011 
    64    r2  0011 
    0     r3  0011 
    4480  r4  0011 
    4544  r5  0011 
    r0    r3  0001 # r6 = r6 AND Partner

    0     r0  0011
    4480  r1  0011
    4543  r2  0011
    0     r3  0011
    4481  r4  0011
    4544  r5  0011
    r0    r3  0111 # OR Cascade

    0     r0  0011
    4543  r1  0011
    4544  r2  0011
    0     r3  0011
    4544  r4  0011
    4545  r5  0011
    r0    r3  0011 # Seed

    0     r0  0011
    4544  r1  0011
    4607  r2  0011
    0     r3  0011
    4545  r4  0011
    4608  r5  0011
    r0    r3  0111 # Cascade OR

    0     r0  0011 # r7
    4544  r1  0011
    4608  r2  0011
    0     r3  0011 # r9
    4672  r4  0011
    4736  r5  0011
    r0    r3  1100 # NOT A

    0     r0  0011 # Frustration
    3904  r1  0011
    3967  r2  0011
    0     r3  0011 # r8
    4609  r4  0011
    4672  r5  0011
    r0    r3  0011 # Shift Left into r8

    1     r8  0111 # Insert 1 at bit 0

    0     r0  0011 # r9
    4672  r1  0011
    4736  r2  0011
    0     r3  0011 # r8
    4608  r4  0011
    4672  r5  0011
    r0    r3  0001 # r8 = r8 AND Fail Mask

    0     r0  0011 # r7
    4544  r1  0011
    4608  r2  0011
    0     r3  0011 # Frustration
    3904  r4  0011
    3968  r5  0011
    r0    r3  0001 # Frustration = Frustration AND Success Mask

    0     r0  0011 # r8
    4608  r1  0011
    4672  r2  0011
    0     r3  0011 # Frustration
    3904  r4  0011
    3968  r5  0011
    r0    r3  0111 # Frustration = Frustration OR r8

    0     r0  0011
    3967  r1  0011
    3968  r2  0011
    0     r3  0011 # r7
    4544  r4  0011
    4545  r5  0011
    r0    r3  0011

    0     r0  0011
    4544  r1  0011
    4607  r2  0011
    0     r3  0011
    4545  r4  0011
    4608  r5  0011
    r0    r3  0111 # Tombstone Mask

    0     r0  0011
    4544  r1  0011
    4608  r2  0011
    0     r3  0011
    4672  r4  0011
    4736  r5  0011
    r0    r3  1100

    2     r8  0011 # Tombstone ID
    0     r0  0011 # r7
    4544  r1  0011
    4608  r2  0011
    0     r3  0011 # r8
    4608  r4  0011
    4672  r5  0011
    r0    r3  0001 # r8 = 2 AND Tombstone Mask

    0     r0  0011 # r9
    4672  r1  0011
    4736  r2  0011
    0     r3  0011 # fw
    4736  r4  0011
    4800  r5  0011
    r0    r3  0001 # fw = fw AND Inverse Tombstone Mask

    0     r0  0011 # r8
    4608  r1  0011
    4672  r2  0011
    0     r3  0011 # fw
    4736  r4  0011
    4800  r5  0011
    r0    r3  0111 # fw = fw OR

  bootloader: |
    0     r0  0011
    5120  r1  0011
    8192  r2  0011
    0     r3  0011
    5120  r4  0011
    8192  r5  0011
    r0    r3  0000 
    0     fw  0011 

  tombstone: |
    0     r0  0011
    5120  r1  0011 
    8192  r2  0011 
    1     r3  0011 
    5120  r4  0011
    8192  r5  0011
    r0    r3  0011 

    0     r0  0011
    3648  r1  0011 
    3712  r2  0011
    0     r3  0011 
    4480  r4  0011
    4544  r5  0011
    r0    r3  0011

    1     r0  0011
    3712  r1  0011
    3776  r2  0011
    0     r3  0011 
    4480  r4  0011
    4544  r5  0011
    r0    r3  1001

    0     r0  0011
    4480  r1  0011
    4543  r2  0011
    0     r3  0011
    4481  r4  0011
    4544  r5  0011
    r0    r3  0001

    0     r0  0011
    4543  r1  0011
    4544  r2  0011
    0     r3  0011 
    4544  r4  0011
    4545  r5  0011
    r0    r3  0011

    0     r0  0011
    4544  r1  0011
    4607  r2  0011
    0     r3  0011
    4545  r4  0011
    4608  r5  0011
    r0    r3  0111

    0     r0  0011
    4544  r1  0011
    4608  r2  0011
    0     r3  0011 
    4608  r4  0011
    4672  r5  0011
    r0    r3  1100

    0     r0  0011
    4608  r1  0011
    4672  r2  0011
    1     r3  0011 
    3712  r4  0011
    3776  r5  0011
    r0    r3  0001

  viral: |
    0     r0  0011
    5120  r1  0011
    8192  r2  0011
    1     r3  0011
    5120  r4  0011
    8192  r5  0011
    r0    r3  0011

    0     r0  0011
    4672  r1  0011
    4736  r2  0011
    1     r3  0011
    4736  r4  0011
    4800  r5  0011
    r0    r3  0011

    1     r3  0011
    4800  r4  0011
    4864  r5  0011
    0     r0  0000
    r0    r3  0000

    0     r0  0011
    4672  r1  0011
    4736  r2  0011
    0     r3  0011
    4736  r4  0011
    4800  r5  0011
    r0    r3  0011

    0     r3  0011
    4800  r4  0011
    4864  r5  0011
    0     r0  0000
    r0    r3  0000
