loglevel: trace
telemetry:
  enabled: true
  ws_url: ws://127.0.0.1:3000/ws
logging:
  logfile: false
  trace:
    path: ''
  elasticsearch:
    enabled: true
    urls:
    - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    password: ''
    api_key: ''
    ca_cert: ''
    insecure_skip_verify: true
system:
  projectRoot: /Users/theapemachine/go/src/github.com/theapemachine/six
  batchSize: 10000
  batchWindow: 500
  queueSize: 20000
  shannonLimit: 0.47
  resonanceThreshold: 0.6
  beliefEpsilon: 0.05
  routeBudget: 128
  maxMembersPerField: 256
  quiescenceTimeout: 100ms
  drainTimeout: 100ms
value:
  word: 64
  words: 128
  bytes: 1024
  num_rotations: 16
  region:
    tokens:
      start: 0
      bits: 1024
    program:
      start: 16
      bits: 1024
    signals:
      start: 32
      bits: 512
    context:
      start: 40
      bits: 512
    gradient:
      start: 48
      bits: 512
    properties:
      start: 56
      bits: 1024
    asset:
      start: 72
      bits: 3072
    prev:
      start: 120
      bits: 64
    next:
      start: 121
      bits: 64
    id:
      start: 122
      bits: 64
    affinity:
      start: 123
      bits: 257
  opcodes:
    false: 0
    and: 1
    aandnotb: 8
    a: 9
    notandb: 64
    b: 65
    xor: 72
    or: 73
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111
  properties:
    - LABELS
    - CONFIDENCE
    - EPOCH
    - TTL
    - TEMPERATURE
    - STATUS
    - NOISE
    - PROGRAM_ID
    - COMMUNITY
    - TARGET
    - ROLE
    - REFERENCE
    - SURPRISAL
    - PREV_SURPRISAL
    - DELTA_SURPRISAL
    - CONTINUATION
  roles:
    - None
    - Programmer
    - Learner
    - Readout
    - Association
    - Prompt
  status:
    - PENDING
    - READY
    - BUSY
    - WAITING
    - SELECTED
    - DONE
    - RESOLVED
    - ERROR
programs:
  query: |
    program query {
      ; Select the community. Each matching B is tagged SELECTED with its
      ; reference word pointing at A.properties.reference (the main value's
      ; id), so the host can group the selection by owner without any
      ; Go-side staging map: selection state lives entirely in the Values.
      gossip(B) {
        (B.{{A.context[0,1]}} == {{A.context[1,1]}}) {
          write B.properties.reference <- A.properties.reference
          set B.properties.status <- SELECTED

          (B.id == A.properties.reference) {
            set B.properties.status <- READY
          }
        }
      }

      set A.properties.status <- DONE
    }

  structural_component: |
    program structural_component {
      ; Pop the next B value from the community.
      pop(B) {
        ; Keep cancel and merge witnesses in the 8-word signal lane so
        ; downstream readout can scan zero-runs and one-runs directly.
        write A.signals[0,4] <- xor(A.tokens[0,4], B.tokens[0,4])
        write A.signals[4,4] <- and(A.tokens[4,4], B.tokens[4,4])
      }
    }

  recruit_community: |
    program recruit_community {
      ; Each pass forms one community from the remaining unassigned Values
      ; in the selected lane. A fresh recruiter keeps the same reference lane
      ; and repeats until no unassigned candidate can seed a new community.
      pop(B) {
        (B.properties.community == 0) {
          (A.context[0,5] == 0) {
            write A.context[0,5] <- B.affinity
          }

          (popcnt(xor(A.context[0,5], B.affinity)) < 64) {
            write A.affinity <- or(A.affinity, B.affinity)
            set B.properties.community <- A.id
          }
        }
      }

      ; If this pass accepted at least one candidate, emit the next recruiter
      ; on the same reference lane. The next pass skips already assigned
      ; Values and seeds a new community from the first residual candidate.
      (popcnt(A.affinity) > 0) {
        set A.properties.community <- A.id
        set A.properties.target <- A.id

        emit {
          set program <- A.program
          set asset <- A.asset
          set properties.reference <- A.properties.reference
        }
      }
    }
  classify_readout: |
    program classify_readout {
      ; A linked prompt should emit one answer. The head Value owns readout;
      ; tails execute the same firmware but retire without contributing labels.
      (A.prev == 0) {
        pop(B) {
          (B.properties.role == Prompt) {
            set B.properties.community <- 0

            (B.properties.reference == A.id) {
              write A.affinity <- or(A.affinity, B.affinity)
            }
          }

          ; Community selection is nearest-neighbour over affinity. The
          ; scalar Hamming witness stays in signals so surprisal remains
          ; reserved for prediction-error dynamics.
          (B.properties.target != 0) {
            write B.signals[0,5] <- xor(A.affinity, B.affinity)
            set B.signals[5,1] <- popcnt(B.signals[0,5])
          }
        }

        set A.properties.community <- argmin_nonzero(B.properties.target, B.signals[5,1])
        set A.properties.labels <- mode_eq(B.properties.labels, B.properties.community, A.properties.community)

        set A.properties.status <- RESOLVED
      }

      (A.prev != 0) {
        set A.properties.status <- DONE
      }

      set A.properties.continuation <- 0
    }
