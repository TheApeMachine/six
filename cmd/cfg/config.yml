loglevel: trace
telemetry:
  enabled: true
  ws_url: ws://127.0.0.1:3000/ws
logging:
  logfile: false
  trace:
    path: ''
  elasticsearch:
    enabled: true
    urls:
    - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    password: ''
    api_key: ''
    ca_cert: ''
    insecure_skip_verify: true
system:
  projectRoot: /Users/theapemachine/go/src/github.com/theapemachine/six
  batchSize: 10000
  batchWindow: 500
  queueSize: 20000
  shannonLimit: 0.47
  resonanceThreshold: 0.6
  beliefEpsilon: 0.05
  routeBudget: 128
  maxMembersPerField: 256
  quiescenceTimeout: 100ms
  drainTimeout: 100ms
value:
  word: 64
  words: 128
  bytes: 1024
  num_rotations: 16
  region:
    tokens:
      start: 0
      bits: 1024
    program:
      start: 16
      bits: 1024
    signals:
      start: 32
      bits: 512
    context:
      start: 40
      bits: 512
    gradient:
      start: 48
      bits: 512
    properties:
      start: 56
      bits: 1024
    asset:
      start: 72
      bits: 3072
    prev:
      start: 120
      bits: 64
    next:
      start: 121
      bits: 64
    id:
      start: 122
      bits: 64
    affinity:
      start: 123
      bits: 257
  opcodes:
    false: 0
    and: 1
    aandnotb: 8
    a: 9
    notandb: 64
    b: 65
    xor: 72
    or: 73
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111
  properties:
    - LABELS
    - CONFIDENCE
    - EPOCH
    - TTL
    - TEMPERATURE
    - STATUS
    - NOISE
    - PROGRAM_ID
    - COMMUNITY
    - TARGET
    - ROLE
    - REFERENCE
    - SURPRISAL
    - PREV_SURPRISAL
    - DELTA_SURPRISAL
    - CONTINUATION
  roles:
    - None
    - Programmer
    - Learner
    - Readout
    - Association
    - Prompt
  status:
    - PENDING
    - READY
    - BUSY
    - WAITING
    - DONE
    - RESOLVED
    - ERROR
programs:
  query: |
    program query {
      ; For every popped B: stamp it with the recruiter's id (carried
      ; in A.properties.reference) and push it into staging[recruiter.id]
      ; via the kernel's stage instruction. Selection is fully in-band:
      ; no Go-side scan reads these markers, the recruiter receives its
      ; lane directly from this sweep's stage emissions.
      pop(B) {
        write B.properties.reference <- A.properties.reference
        stage(B)
      }
    }

  structural_component: |
    program structural_component {
      ; Pop the next B value from the community.
      pop(B) {
        ; Find the longest run of zeros when comparing A.tokens with B.tokens.
        A.signals[0,1] <- and(A.tokens, B.tokens)
        A.signals[1,1] <- xor(A.tokens, rot_left(B.tokens, 8))
        A.signals[2,1] <- xor(A.tokens, rot_left(B.tokens, 16))
        A.signals[3,1] <- xor(A.tokens, rot_left(B.tokens, 24))
        A.signals[4,1] <- xor(A.tokens, rot_left(B.tokens, 32))
        A.signals[5,1] <- xor(A.tokens, rot_left(B.tokens, 40))
        A.signals[6,1] <- xor(A.tokens, rot_left(B.tokens, 48))
        A.signals[7,1] <- xor(A.tokens, rot_left(B.tokens, 56))
        A.signals[8,1] <- xor(A.tokens, rot_left(B.tokens, 64))
        A.signals[9,1] <- xor(A.tokens, rot_left(B.tokens, 72))
        A.signals[10,1] <- xor(A.tokens, rot_left(B.tokens, 80))
        A.signals[11,1] <- xor(A.tokens, rot_left(B.tokens, 88))
        A.signals[12,1] <- xor(A.tokens, rot_left(B.tokens, 96))
        A.signals[13,1] <- xor(A.tokens, rot_left(B.tokens, 104))
        A.signals[14,1] <- xor(A.tokens, rot_left(B.tokens, 112))
        A.signals[15,1] <- xor(A.tokens, rot_left(B.tokens, 120))
      }
    }

  recruit_community: |
    program recruit_community {
      ; Hypercube gossip: one OR folds the affinity bit-union over every
      ; staged peer in a single instruction. After the sweep, A.affinity
      ; reflects the merged Hamming neighborhood of self plus the whole
      ; community lane.
      gossip(B) {
        write A.affinity <- or(A.affinity, B.affinity)

        ; Stamp every peer's community word with the recruiter's id so
        ; downstream code can see who joined which community.
        write B.properties.community <- A.id
      }

      ; If popcount(A.affinity) >= 121 the recruiter has reached the
      ; Shannon ceiling for a 257-bit window. Stamp DONE and emit a
      ; fresh recruiter to keep the chain going.
      (A.affinity >= 121) {
        set A.properties.status <- DONE

        emit {
          set program <- A.program
        }
      }
    }
