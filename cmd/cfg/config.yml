loglevel: trace

# UDP destination for experiment pipeline telemetry (Observer JSON + raw frames).
telemetry:
  enabled: true
  udp_endpoint: "127.0.0.1:8258"
  # High volume: one UDP event per LGP slot per CPU UniversalBitwise tile (viz / debug only).
  universal_bitwise_slots: true

# Logging and trace shipping (see pkg/errnie/logging_config.go).
logging:
  logfile: false
  trace:
    # Empty path writes to ./trace.log under the process working directory.
    path: ""
  elasticsearch:
    # Must be true for logs to ship. Or export ELASTICSEARCH_ENABLED=true.
    enabled: true
    urls:
      - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    # Leave empty and set ELASTIC_PASSWORD (e.g. from .env) for Docker stacks.
    password: ""
    # Base64 API key (optional); overrides username/password when set. Or ELASTICSEARCH_API_KEY.
    api_key: ""
    # PEM path to the cluster CA (e.g. Elasticsearch docker certs/ca/ca.crt).
    ca_cert: ""
    # Local development only when you cannot mount the CA.
    insecure_skip_verify: true
    # Low-latency shipping defaults are applied when these are omitted (near-real-time in Kibana).
    # bulk_flush_bytes: 1
    # flush_interval_ms: 50
    # bulk_refresh: "true"

system:
  projectRoot: "/Users/theapemachine/go/src/github.com/theapemachine/six"
  batchSize: 10000
  batchWindow: 500
  # gatherBatch waits at least this long (µs) so a second frame can arrive after
  # prompt settle (Machine.Read waitForPrompt ~50ms). Compared with batchWindow.
  evolutionBatchWindow: 75000
  holisticChunkBits: 512
  holisticHammingMax: 0.45
  mapElitesInjectionRate: 0.08
  mapElitesGridShift: 8
  tokenSettleMaxPasses: 4
  tokenSettleEpsilonBits: 0
  thermodynamicEnergyWord: -1
  thermodynamicBirthEnergy: 256
  thermodynamicDecayDelta: 1
  thermodynamicEmitGain: 8
  sleepMaxPairs: 4
  # When true, seed frames collocate with K-bucket peers; disposable witness
  # clones carry the high ID bit so Move/crossover/decay skip them.
  kBucketCoLocatedBatch: true
  queueSize: 20000

controlplane:
  k: 20
  alpha: 3
  affinity:
    start: 63
    bits: 64

value:
  words: 128
  bytes: 1024
  region:
    tokens:
      start: 0
      bits: 3648
    id:
      start: 57
      bits: 64
    prev:
      start: 58
      bits: 64
    next:
      start: 59
      bits: 64
    state: 
      index: 60
      sequence: 61
      accumulator: 62
    affinity:
      start: 63
      bits: 64
    registers:
      start: 64
      bits: 768
      r0: 64
      r1: 65
      r2: 66
      r3: 67
      r4: 68
      r5: 69
      r6: 70
      r7: 71
      r8: 72
      r9: 73
      fw: 74
      pc: 75
    pc:
      start: 75
      bits: 64
    program:
      start: 76
      bits: 3328
  opcodes:
    false: 0000
    and: 0001
    aandnotb: 0010
    a: 0011
    notandb: 0100
    b: 0101
    xor: 0110
    or: 0111
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111


# Substrate Firmware Programs
#
# 32-bit hardware LGP assembly (two slots per uint64 program word).
# Each line: OP SRC_WORD DST_WORD — see pkg/core/CompileFunc and
# pkg/compute/kernel/cpu.executeScalarInstruction (NOP / HALT → opcode 0).

programs:
  learn: |
    NOP
    NOP

  bootloader: |
    NOP
    NOP

  # Tombstone: zero selected words via FALSE (truth-table 0) with arbitrary src.
  tombstone: |
    FALSE 0 0
    FALSE 0 1
    FALSE 0 2
    FALSE 0 3
    FALSE 0 4
    FALSE 0 5
    FALSE 0 6
    FALSE 0 7
    FALSE 0 57
    FALSE 0 58
    FALSE 0 59
    FALSE 0 60
    FALSE 0 61
    FALSE 0 62
    FALSE 0 63

  viral: |
    NOP

  build: |
    NOP
    NOP

  # Same physics as prompt: active LSM fetch + affinity-driven FW for MAP-Elites routing.
  # 2415927173 (0x8FFBD005): one 32-bit LGP *extended* slot word. Bit 31 must be set so
  # CUDA/Metal execute_extended_slot runs (see pkg/compute/kernel/metal/backend.metal).
  # Layout: [31]=1 extended, [6:0]=ext_opcode (here 5), [13:7]=argA, [20:14]=argB, [27:21]=argC.
  # ext_opcode 5 writes MLMD state: STATE_INDEX_WORD = 0x4D4D4C44 ("MLMD"), STATE_ACCUM_WORD =
  # argA|(argB<<8); with argA=63, argB=0 this tags affinity word 63 for the active in-band
  # load/priority path (yaml mnemonic LGPXMemoryLoadMark / "active fetch"). Plain slots use
  # [3:0] truth-table op — do not confuse with this extended encoding.
  query: |
    2415927173 0 0
    COPY 63 74

  # Active fetch: same literal 2415927173 extended word as query, then COPY 63 74 to morph
  # FW register (word 74) from the current affinity hash on the next tick.
  prompt: |
    2415927173 0 0
    COPY 63 74

# Stepwise fixed-step programs (pkg/compute/stepwise). When non-empty for a slot,
# installFirmware uses InstallEmbedded and overwrites programs.* packing for
# that firmware only. Syntax: IMM, NOP, TTNAME ia ib idst [LEFT_B] [RIGHT_B].
programsStepwise:
  bootloader: |
    IMM 74 1

