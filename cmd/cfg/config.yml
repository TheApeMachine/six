loglevel: trace
telemetry:
  enabled: true
  ws_url: ws://127.0.0.1:3000/ws
logging:
  logfile: false
  trace:
    path: ''
  elasticsearch:
    enabled: true
    urls:
    - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    password: ''
    api_key: ''
    ca_cert: ''
    insecure_skip_verify: true
system:
  projectRoot: /Users/theapemachine/go/src/github.com/theapemachine/six
  batchSize: 10000
  batchWindow: 500
  queueSize: 20000
  shannonLimit: 0.47
  resonanceThreshold: 0.6
  beliefEpsilon: 0.05
  routeBudget: 128
  maxMembersPerField: 256
  quiescenceTimeout: 100ms
  drainTimeout: 100ms
value:
  word: 64
  words: 128
  bytes: 1024
  num_rotations: 16
  region:
    tokens:
      start: 0
      bits: 1024
    program:
      start: 16
      bits: 1024
    signals:
      start: 32
      bits: 512
    context:
      start: 40
      bits: 512
    gradient:
      start: 48
      bits: 512
    properties:
      start: 56
      bits: 1024
    asset:
      start: 72
      bits: 3072
    prev:
      start: 120
      bits: 64
    next:
      start: 121
      bits: 64
    id:
      start: 122
      bits: 64
    affinity:
      start: 123
      bits: 257
  opcodes:
    false: 0
    and: 1
    aandnotb: 8
    a: 9
    notandb: 64
    b: 65
    xor: 72
    or: 73
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111
  properties:
    - LABELS
    - CONFIDENCE
    - EPOCH
    - TTL
    - TEMPERATURE
    - STATUS
    - NOISE
    - PROGRAM_ID
    - COMMUNITY
    - TARGET
    - ROLE
    - REFERENCE
    - SURPRISAL
    - PREV_SURPRISAL
    - DELTA_SURPRISAL
    - STUCK_COUNT
    - FALSIFIED
    - STUCK
    - CONTINUATION
  roles:
    - None
    - Programmer
    - Learner
    - Readout
    - Association
    - Prompt
  status:
    - PENDING
    - READY
    - BUSY
    - WAITING
    - DONE
    - RESOLVED
    - ERROR
programs:
  link: |
    [ { A(prev) A(asset[0,1]) | } ]
    [ { A(next) A(asset[1,1]) | } ]
    [ { A(continuation) A(id) | } ]
  affinity: |
    [ { A(affinity[0,5]) A(tokens[0,16]) ^ } ]
  structural_component: |
    <[
      { B(prev) B(id) ^ }
      { B(next) B(id) ^ }
    ] <= [
      { A(status) done ^ }
      { B(tokens) signals[0, 1] ^ }
      { B(tokens) signals[1, 1] ^ }
      { B(tokens) signals[2, 1] ^ }
    ]> [
        { B(signals) }
    ] <= [
        { B(tokens[0,16]) B(tokens[0,16]) & }
        { B(tokens[0,16]) { B(tokens[0,16] 8 <<) } & }
    ]
  popcount: |
    [ { A(affinity[4,1]) A(affinity[0,5]) popcnt } ]
  coupling: |
    [ { A(tokens[0,16]) A(affinity[0,5]) & } ]
    [ { A(signals[0,1]) A(signals[0,1]) popcnt } ]
    [ { A(tokens[0,16]) A(affinity[0,5]) | } ]
    [ { A(signals[1,1]) A(signals[1,1]) popcnt } ]
  beam_swarm_step: |
    [ { A(context[0,8]) A(gradient[0,8]) ^ } ]
    [ { A(tokens[0,8]) A(context[0,8]) ^ } ]
    [ { A(falsified) A(signals[0,8]) popcnt } ]
    [ { A(falsified) A(confidence) | } ]
    [ { A(affinity[0,5]) A(falsified) ^ } ]
    [ { A(gradient[0,8]) A(signals[0,8]) ^ } ]
    [ { A(continuation) A(id) | } ]
  surprisal: |
    [ { A(tokens[0,8]) A(context[0,8]) ^ } ]
    [ { A(falsified) A(signals[0,8]) popcnt } ]
    [ { A(gradient[0,8]) A(signals[0,8]) ^ } ]
    [ { A(continuation) A(id) | } ]
  hypothesis: |
    [ { A(context[0,8]) A(gradient[0,8]) ^ } ]
    [ { A(confidence) A(signals[0,8]) popcnt } ]
    [ { A(confidence) A(id) | } ]
  memory_prune: |
    [ { A(confidence) 1 | } ] <= [ { { A(status) 0 != } ? } ]
    [ { A(confidence) 1 \ } ] <= [ { { A(falsified) 0 != } ? } ]
    [ { A(ttl) 1 \ } ] <= [ { { A(confidence) 0 == } ? } ]
    [ { A(continuation) 0 } ] <= [ { { A(ttl) 0 == } ? } ]
    [ { A(continuation) A(id) } ] <= [ { { A(ttl) 0 != } ? } ]
  temperature: |
    [ { A(affinity[0,5]) A(temperature) ^ } ]
    [ { A(temperature) 1 | } ] <= [ { { A(delta_surprisal) 0 == } ? } ]
    [ { A(ttl) 1 \ } ] <= [ { { A(temperature) 0 != } ? } ]
    [ { A(continuation) 0 } ] <= [ { { A(ttl) 0 == } ? } ]
    [ { A(continuation) A(id) } ] <= [ { { A(ttl) 0 != } ? } ]
  active_inference: |
    [ { A(tokens[0,8]) A(context[0,8]) ^ } ]
    [ { A(prev_surprisal) A(surprisal) | } ]
    [ { A(surprisal) A(signals[0,8]) popcnt } ]
    [ { A(delta_surprisal) A(prev_surprisal) ^ } ]
    [ { A(context[0,8]) A(gradient[0,8]) ^ } ]
    [ { A(stuck_count) 1 | } ] <= [ { { A(delta_surprisal) 0 == } ? } ]
    [ { A(stuck_count) 0 } ] <= [ { { A(delta_surprisal) 0 != } ? } ]
    [ { A(stuck) 1 } ] <= [ { { A(stuck_count) 0 != } ? } ]
    [ { A(continuation) 0 } ] <= [ { { A(surprisal) 0 == } ? } ]
    [ { A(status) 5 B } ] <= [ { { A(surprisal) 0 == } ? } ]
    [ { A(continuation) A(id) } ] <= [ { { A(surprisal) 0 != } ? } ]
  causal_explore: |
    [ { A(tokens[0,8]) A(context[0,8]) -> } ]
    [ { A(falsified) A(signals[0,8]) any_zero } ]
    [ { A(gradient[0,8]) A(context[0,8]) ^ } ] <= [ { { A(falsified) 0 != } ? } ]
    [ { A(status) 4 B } ] <= [ { { A(falsified) 0 == } ? } ]
    [ { A(continuation) 0 } ]
  recruit_community: |
    <[{ A clear }]> [
        { A(affinity) B(affinity) ^ }
    ] <= [
        { A(status) done }
    ] <= [
        { A(id) B(community) ^ }
    ] <= [
        { { A(affinity) popcnt } 120 ? }
    ] <= [
        { { A(affinity) B(affinity) ^ } 64 | }
    ]
  causal_hub: |
    [ { A(tokens[0,8]) A(context[0,8]) ^ } ]
    [ { A(gradient[0,8]) A(context[0,8]) ^ } ]
    [ { A(falsified) A(signals[0,8]) popcnt } ]
    [ { A(falsified) A(epoch) | } ]
    [ { A(gradient[0,8]) A(asset[40,8]) ^ } ]
    [ { A(continuation) A(id) | } ]
  open_ended_generation: |
    [ { A(tokens[0,16]) A(asset[8,16]) ^ } ]
    [ { A(tokens[0,8]) A(context[0,8]) -> } ]
    [ { A(falsified) A(signals[0,8]) any_zero } ]
    [ { A(continuation) 0 } ] <= [ { { A(falsified) 0 != } ? } ]
    <[{ A clear }]> <= [ { { A(falsified) 0 == } ? } ]
  survey_community: |
    [ { A(context[7,1]) A(context[6,1]) } ]
    [ { A(context[6,1]) A(context[5,1]) } ]
    [ { A(context[5,1]) A(context[4,1]) } ]
    [ { A(context[4,1]) A(context[3,1]) } ]
    [ { A(context[3,1]) A(context[2,1]) } ]
    [ { A(context[2,1]) A(context[1,1]) } ]
    [ { A(context[1,1]) A(context[0,1]) } ]
    [ { A(context[0,1]) A(asset[24,1]) } ]
    [ { A(labels) A(context[0,8]) popcnt } ]
    [ { A(status) 5 B } ] <= [ { { A(labels) 0 != } ? } ]
    [ { A(continuation) 0 } ] <= [ { { A(labels) 0 != } ? } ]
    [ { A(continuation) A(id) } ] <= [ { { A(labels) 0 == } ? } ]
  meta_controller: |
    [ { A(continuation) 4 B } ] <= [ { { A(falsified) 0 != } ? } ]
    [ { A(continuation) 5 B } ] <= [ { { A(stuck) 0 != } ? } ]
    [ { A(continuation) 6 B } ] <= [ { { A(surprisal) 0 == } ? } ]
    [ { A(continuation) 0 } ] <= [ { { A(ttl) 0 == } ? } ]
    [ { A(continuation) 7 B } ] <= [ { { A(surprisal) 0 != } ? } ]
  classify_readout: |
    [ { A(labels) A(asset[24,1]) } ] <= [ { { A(labels) 0 == } ? } ]
    [ { A(labels) A(labels) | } ]
    [ { A(status) 5 B } ] <= [ { { A(labels) 0 != } ? } ]
    [ { A(continuation) 0 } ] <= [ { { A(labels) 0 != } ? } ]
    [ { A(continuation) A(id) } ] <= [ { { A(labels) 0 == } ? } ]
  episodic_replay: |
    [ { A(context[0,8]) A(asset[8,8]) ^ } ]
    [ { A(confidence) A(signals[0,8]) popcnt } ]
  intervene: |
    [ { A(context[0,8]) A(asset[16,8]) ^ } ]
    [ { A(falsified) A(signals[0,8]) | } ]
    [ { A(falsified) A(falsified) popcnt } ]
    [ { A(gradient[0,8]) A(asset[16,8]) ^ } ]
  vote_swarm: |
    [ { A(context[0,8]) A(asset[0,8]) ^ } ]
    [ { A(asset[24,1]) 0 } ] <= [ { { A(labels) 0 != } ? } ]
    [ { A(labels) A(asset[24,1]) | } ] <= [ { { A(asset[24,1]) 0 != } ? } ]
    [ { A(signals[1,1]) A(labels) } ]
    [ { A(signals[2,1]) A(role) 5 ^ } ]
    [ { A(signals[1,1]) 0 } ] <= [ { { A(signals[2,1]) 0 != } ? } ]
    [ { A(role) 3 B } ] <= [ { { A(signals[1,1]) 0 != } ? } ]
    [ { A(status) 5 B } ] <= [ { { A(signals[1,1]) 0 != } ? } ]
    [ { A(surprisal) 1 B } ] <= [ { { A(signals[1,1]) 0 != } ? } ]
    [ { A(continuation) 0 } ] <= [ { { A(signals[1,1]) 0 != } ? } ]
    [ { A(continuation) A(id) } ] <= [ { { A(signals[1,1]) 0 == } ? } ]
