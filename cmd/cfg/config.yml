loglevel: debug

# Logging and trace shipping (see pkg/errnie/logging_config.go).
logging:
  logfile: false
  trace:
    # Empty path writes to ./trace.log under the process working directory.
    path: ""
  elasticsearch:
    # Must be true for logs to ship. Or export ELASTICSEARCH_ENABLED=true.
    enabled: true
    urls:
      - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    # Leave empty and set ELASTIC_PASSWORD (e.g. from .env) for Docker stacks.
    password: ""
    # Base64 API key (optional); overrides username/password when set. Or ELASTICSEARCH_API_KEY.
    api_key: ""
    # PEM path to the cluster CA (e.g. Elasticsearch docker certs/ca/ca.crt).
    ca_cert: ""
    # Local development only when you cannot mount the CA.
    insecure_skip_verify: true
    # Low-latency shipping defaults are applied when these are omitted (near-real-time in Kibana).
    # bulk_flush_bytes: 1
    # flush_interval_ms: 50
    # bulk_refresh: "true"

system:
  projectRoot: "/Users/theapemachine/go/src/github.com/theapemachine/six"

numerics:
  words: 128
  corebits: 8191
  epsilon: 1e-9
  nsymbols: 256
  nbasis: 512

value:
  words: 128
  region:
    tokens:
      start: 0
      bits: 3648
    id:
      start: 57
      bits: 64
    prev:
      start: 58
      bits: 64
    next:
      start: 59
      bits: 64
    state: 
      index: 60
      sequence: 61
      accumulator: 62
    affinity:
      start: 64
      bits: 64
    gossip:
      start: 65
      bits: 320
    ttl:
      start: 70
      bits: 8
    registers:
      start: 71
      bits: 64
      r0: 71
      r1: 72
      r2: 73
      r3: 74
      r4: 75
      r5: 76
      fw: 77
      pc: 78
    pc:
      start: 78
      bits: 64
    program:
      start: 79
      bits: 3136
  opcodes:
    false: 0000
    and: 0001
    aandnotb: 0010
    a: 0011
    notandb: 0100
    b: 0101
    xor: 0110
    or: 0111
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111


# Substrate Firmware Programs
# Format: src dest gate (Polish Notation, 2-address)
#
# Operands:
#   number    = immediate value (0-127)
#   rN        = register (r0-r5, pc)
#   *N        = dereference: read word[N]
#   *rN       = dereference through register
#   bN / brN  = partner (Value B) word/register
#
# Registers (triple model):
#   r0 = context A (0=self, 1=partner)
#   r1 = offset A
#   r2 = length A
#   r3 = context B (0=self, 1=partner)
#   r4 = offset B
#   r5 = length B
#   r6 = firmware index (set to prompt backend to load from config into Value's PC=8)
#
# Gates: all 16 two-input boolean truth tables (0000-1111)
#   0000=FALSE  0001=AND   0010=A∧¬B  0011=A
#   0100=¬A∧B   0101=B     0110=XOR   0111=OR
#   1000=NOR    1001=XNOR  1010=¬B    1011=B→A
#   1100=¬A     1101=A→B   1110=NAND  1111=TRUE
#
# Control flow:
#   Directly manipulate the PC register (word 78) to branch.
#   Write a line number to PC to jump. 
#   Loop: Write target line to PC. Exit loop: Write currentpc + 1 to PC.

programs:
  # Dummy program to take index 0 so that affinity is index 1
  00_null: |
    0     pc  0000

  # Bootloader: copies user program from partner (Value B) into self's
  # user program region (words 83-127, bits 5312-8128), preserving
  # the bootloader in slots 0-7 (words 79-82). Then jumps to slot 8.
  bootloader: |
    0     r0  0011 // Triplet A context = 0 (Self)
    5312  r1  0011 // Triplet A offset = 83*64 (skip bootloader)
    2880  r2  0011 // Triplet A length = 45*64 (words 83-127)
    1     r3  0011 // Triplet B context = 1 (Partner)
    5312  r4  0011 // Triplet B offset = 83*64
    2880  r5  0011 // Triplet B length = 45*64
    r3    r0  0011 // Copy from Partner user region to Self user region
    8     pc  0011 // jump to slot 8

  # Affinity: XOR Tokens and adopt Partner's structural links
  affinity: |
    0     r0  0011 // Triplet A context = 0 (Self)
    0     r1  0011 // Triplet A offset = 0 (Tokens)
    3648  r2  0011 // Triplet A length = 57*64 = 3648 bits
    1     r3  0011 // Triplet B context = 1 (Partner)
    0     r4  0011 // Triplet B offset = 0
    3648  r5  0011 // Triplet B length = 3648 bits
    r3    r0  0110 // XOR Partner Tokens to Self Tokens
    3712  r1  0011 // Triplet A offset = 58*64 (PrevID & NextID)
    128   r2  0011 // Triplet A length = 128
    3712  r4  0011 // Triplet B offset = 58*64
    128   r5  0011 // Triplet B length = 128
    r3    r0  0011 // COPY Partner Links to Self Links

  # Shatter: 3-pass AND for structural decomposition
  shatter: |
    0     r0  0011 // Triplet A context = 0 (Self)
    0     r1  0011 // Triplet A offset = 0
    3648  r2  0011 // Triplet A length = 3648
    1     r3  0011 // Triplet B context = 1 (Partner)
    0     r4  0011 // Triplet B offset = 0
    3648  r5  0011 // Triplet B length = 3648
    r3    r0  0001 // AND pass 1
    r3    r0  0001 // AND pass 2
    r3    r0  0001 // AND pass 3

  # Tombstone: nullify links using structural zeroing (simulated via FALSE gate over ID spans)
  tombstone: |
    0     r0  0011 // Triplet A context = 0 (Self)
    3712  r1  0011 // Triplet A offset = 58*64
    128   r2  0011 // Triplet A length = 128
    1     r3  0011 // Triplet B context = 1 (Partner)
    3712  r4  0011 // Triplet B offset = 58*64
    128   r5  0011 // Triplet B length = 128
    r3    r0  0000 // FALSE gate to zero the Links span

  # Wipe: zero the user program region (slots 8+, words 83-127)
  # using FALSE gate on self. This is how programs clean up before
  # chaining to the next firmware via the bootloader.
  wipe: |
    0     r0  0011 // Triplet A context = 0 (Self)
    5312  r1  0011 // Triplet A offset = 83*64 (user program start)
    2880  r2  0011 // Triplet A length = 45*64 (user program region)
    0     r3  0011 // Triplet B context = 0 (Self)
    5312  r4  0011 // Triplet B offset = 83*64
    2880  r5  0011 // Triplet B length = 45*64
    r3    r0  0000 // FALSE gate zeros the user program region

  # Viral: propagate self program to partner, then chain self to affinity.
  # 1. Copy self's full program region into partner's program region
  # 2. Zero partner's PC so partner boots from its bootloader
  # 3. Set self's FW to wipe (5) so self wipes its user program
  #    before the bootloader loads affinity (3) on the next cycle.
  viral: |
    1     r0  0011 // Triplet A context = 1 (Partner) — destination
    5056  r1  0011 // Triplet A offset = 79*64 (program region start)
    3136  r2  0011 // Triplet A length = 49*64 (full program region)
    0     r3  0011 // Triplet B context = 0 (Self) — source
    5056  r4  0011 // Triplet B offset = 79*64
    3136  r5  0011 // Triplet B length = 49*64
    r3    r0  0011 // Copy Self Program to Partner
    1     r0  0011 // Triplet A context = 1 (Partner)
    4992  r1  0011 // Triplet A offset = 78*64 (PC word)
    64    r2  0011 // Triplet A length = 64 bits
    1     r3  0011 // Triplet B context = 1 (Partner)
    4992  r4  0011 // Triplet B offset = 78*64
    64    r5  0011 // Triplet B length = 64
    r3    r0  0000 // FALSE gate zeros Partner PC → boots from bootloader
    3     fw  0011 // Set Self FW to affinity (index 3)
    0     pc  0011 // Reset Self PC → bootloader loads affinity

  # Query: match affinity with partner via XNOR, accumulate partner
  # tokens into self token region via AND, and adopt partner links.
  # This is the "search" firmware: circulating Values run this after
  # the affinity program has folded structure into the affinity word.
  #
  # Step 1: XNOR self.affinity ⊕ partner.affinity → self.affinity
  #         (matching bits become 1, differing bits become 0)
  # Step 2: AND partner.tokens with self.tokens → self.tokens
  #         (keep only tokens that both share)
  # Step 3: Copy partner links → self links (walk the graph)
  # Step 4: Decrement TTL by ANDing with self (no-op placeholder)
  # Step 5: Chain to wipe → bootloader reloads next firmware
  query: |
    0     r0  0011 // Triplet A context = 0 (Self)
    4096  r1  0011 // Triplet A offset = 64*64 (affinity word)
    64    r2  0011 // Triplet A length = 64 bits
    1     r3  0011 // Triplet B context = 1 (Partner)
    4096  r4  0011 // Triplet B offset = 64*64
    64    r5  0011 // Triplet B length = 64 bits
    r3    r0  1001 // XNOR: matching affinity bits → 1
    0     r1  0011 // Triplet A offset = 0 (Tokens)
    3648  r2  0011 // Triplet A length = 57*64 = 3648
    0     r4  0011 // Triplet B offset = 0
    3648  r5  0011 // Triplet B length = 3648
    r3    r0  0001 // AND: keep shared tokens
    3712  r1  0011 // Triplet A offset = 58*64 (links: PrevID & NextID)
    128   r2  0011 // Triplet A length = 128
    3712  r4  0011 // Triplet B offset = 58*64
    128   r5  0011 // Triplet B length = 128
    r3    r0  0011 // COPY partner links to self (walk graph)
    5     fw  0011 // Chain to wipe (index 5)
    0     pc  0011 // Reset PC → bootloader loads wipe