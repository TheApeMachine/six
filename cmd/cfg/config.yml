loglevel: trace

# UDP destination for experiment pipeline telemetry (Observer JSON + raw frames).
telemetry:
  enabled: true
  udp_endpoint: "127.0.0.1:8258"
  # High volume: one UDP event per LGP slot per CPU UniversalBitwise dispatch (viz / debug only).
  universal_bitwise_slots: true

# Logging and trace shipping (see pkg/errnie/logging_config.go).
logging:
  logfile: false
  trace:
    # Empty path writes to ./trace.log under the process working directory.
    path: ""
  elasticsearch:
    # Ship structured logs to Elasticsearch. Set false when the cluster is not
    # running (or export ELASTICSEARCH_ENABLED=0) to avoid noisy I/O; errnie also
    # rate-limits repeated ES errors when enabled but unreachable.
    enabled: true
    urls:
      - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    # Leave empty and set ELASTIC_PASSWORD (e.g. from .env) for Docker stacks.
    password: ""
    # Base64 API key (optional); overrides username/password when set. Or ELASTICSEARCH_API_KEY.
    api_key: ""
    # PEM path to the cluster CA (e.g. Elasticsearch docker certs/ca/ca.crt).
    ca_cert: ""
    # Local development only when you cannot mount the CA.
    insecure_skip_verify: true
    # Low-latency shipping defaults are applied when these are omitted (near-real-time in Kibana).
    # bulk_flush_bytes: 1
    # flush_interval_ms: 50
    # bulk_refresh: "true"

system:
  projectRoot: "/Users/theapemachine/go/src/github.com/theapemachine/six"
  batchSize: 10000
  batchWindow: 500
  queueSize: 20000
  shannonLimit: 0.47
  resonanceThreshold: 0.6
  beliefEpsilon: 0.05

value:
  word: 64
  words: 128
  bytes: 1024
  # UniversalBitwise rotates the B span in 8-bit steps; one opcode per rotation.
  num_rotations: 16
  region:
    tokens:
      start: 0
      bits: 1024
    program:
      start: 16
      bits: 512
    signals:
      start: 24
      bits: 512
    context:
      start: 32
      bits: 512
    gradient:
      start: 40
      bits: 512
    properties:
      start: 48
      bits: 512
    asset:
      start: 56
      bits: 4096
    prev:
      start: 120
      bits: 64
    next:
      start: 121
      bits: 64
    id:
      start: 122
      bits: 64
    affinity:
      start: 123
      bits: 257
  opcodes:
    false: 0000
    and: 0001
    aandnotb: 0010
    a: 0011
    notandb: 0100
    b: 0101
    xor: 0110
    or: 0111
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111
  rules:
    - name: link
      conditions:
        prev: false
        next: false
      firmware: link
    - name: affinity
      conditions:
        and:
          or:
            prev: true
            next: true
          affinity: false
      firmware: affinity


programs:
  # Region refs are region[start,span] where span is the number of 64-bit
  # words. A bare region[index] means span=1. Every DSL line is:
  #   srcA  srcB  dst  op  mode
  # mode is one of:
  #   accumulate  XOR the 8 signal words the substrate writes into the dst
  #               slice (up to the dst span). Successive lines layer on top
  #               of the same dst, so multi-line programs build up state.
  #   reduce      popcount the whole signals region and write the total to
  #               dst[start]; dst[start+1..] is untouched.
  # Optional last line: next <value_id> | next self  (scheduler: word 117).

  # Link generation: the orchestrator stages the previous Value's ID into
  # asset[0] and the next Value's ID into asset[1]. This program copies
  # those IDs into the prev and next regions respectively.
  link: |
    asset[0,1] asset[0,1] prev[0,1] or accumulate
    asset[1,1] asset[1,1] next[0,1] or accumulate
    next self

  # Affinity generation: fold every token word against every other token
  # word through the substrate's 16-rotation sweep, then accumulate the
  # resulting 64-byte LSH signature across the five affinity words. Pure
  # XOR keeps the fold linear so merging two Values' affinities commutes
  # with merging their tokens as clusters approach the Shannon saturation limit.
  affinity: |
    tokens[0,16] tokens[0,16] affinity[0,5] xor accumulate

  # Popcount of the whole Affinity region into its Fermat tail word. This
  # is the saturation witness: when the XOR fold leaves affinity near 47%
  # set bits, the tail word's value crosses the Shannon limit and routing
  # can refuse the cluster.
  popcount: |
    affinity[0,5] affinity[0,5] affinity[4,1] xor reduce

  # Jaccard coupling numerator/denominator. AND then OR over the same
  # operand pair; reduce writes popcount scalars to signals[0] and
  # signals[1] for the Go side to divide. The affinity-vs-tokens shape
  # makes this the routing-distance primitive.
  coupling: |
    tokens[0,16] affinity[0,5] signals[0,1] and reduce
    tokens[0,16] affinity[0,5] signals[1,1] or  reduce

  # Beam-swarm step — emergent exploration run by every Value on a trie
  # node when a prompt Value lands. The Value advances its own state
  # through the local gradient, scores interference against the context
  # attractor, collapses that into a scalar error, OR-s in the field
  # pressure signal, morphs its affinity so high-error Values physically
  # drift away in DHT space, and loops via `next self` so the scheduler
  # keeps spreading the cascade one ALU pass at a time.
  beam_swarm_step: |
    tokens[0,8]     gradient[0,8]   context[0,8]    xor accumulate
    tokens[0,8]     context[0,8]    signals[0,8]    xor accumulate
    signals[0,8]    signals[0,8]    properties[0,1] xor reduce
    properties[0,1] properties[1,1] properties[0,1] or  accumulate
    properties[0,1] affinity[0,5]   affinity[0,5]   xor accumulate
    next self

  # Free Energy / Prediction Error: Computes the gap between the incoming
  # tokens and the context (the local eigenmode/attractor).
  surprisal: |
    tokens[0,8]  context[0,8] signals[0,8]    xor accumulate
    signals[0,8] signals[0,8] properties[0,1] xor reduce

  # Popperian Test: XORs tokens against a predicted-absent pattern in context.
  # A high popcount in properties[1] means the claim held (they differ); a low
  # popcount refutes it. If refuted, we zero the TTL word (properties[3]).
  falsification: |
    tokens[0,8]     context[0,8]    signals[0,8]    xor accumulate
    signals[0,8]    signals[0,8]    properties[1,1] xor reduce
    properties[1,1] properties[3,1] properties[3,1] and accumulate

  # Temperature: Physical noise injected into the Affinity vector during
  # exploration to widen the search space.
  temperature: |
    properties[4,1] affinity[0,5] affinity[0,5] xor accumulate

  # Active Inference: Unified cognitive loop that simulates multiple futures,
  # evaluates their expected free energy, and applies the action that minimizes
  # surprisal.
  active_inference: |
    tokens[0,8]  gradient[0,8]   asset[0,8]   xor accumulate
    tokens[0,4]  properties[4,2] asset[8,4]   and accumulate
    tokens[4,4]  properties[6,2] asset[12,4]  and accumulate
    tokens[0,8]  context[0,8]    asset[16,8]  xor accumulate
    asset[0,8]   context[0,8]    signals[0,8] xor accumulate
    asset[8,8]   context[0,8]    asset[24,8]  xor accumulate
    asset[16,8]  context[0,8]    asset[32,8]  xor accumulate
    signals[0,8] signals[0,8]    signals[0,1] xor reduce
    asset[24,8]  asset[24,8]     signals[1,1] xor reduce
    asset[32,8]  asset[32,8]     signals[2,1] xor reduce
    next self

  # Causal Explore: Single-pass causal gap (tokens XOR context/gradient).
  # Used by phase probes; the field drives parallel population, not one tight loop.
  causal_explore: |
    tokens[0,8]     context[0,8]    signals[0,8]    xor accumulate
    gradient[0,8]   context[0,8]    asset[40,8]     xor accumulate
    signals[0,8]    signals[0,8]    properties[0,2] xor reduce
    properties[0,2] properties[2,2] properties[0,2] or  accumulate

  # Causal Hub: Iterative causal gap exploration.
  # Loops via next self until the queue or finalizer breaks the circuit.
  causal_hub: |
    tokens[0,8]     context[0,8]    signals[0,8]    xor accumulate
    gradient[0,8]   context[0,8]    asset[40,8]     xor accumulate
    signals[0,8]    signals[0,8]    properties[0,2] xor reduce
    properties[0,2] properties[2,2] properties[0,2] or  accumulate
    next self

  # Unsupervised learning: XOR two token spans that the orchestrator has staged
  # into asset[0,16] (peer A, tokens 0-15) and asset[16,16] (peer B,
  # tokens 0-15). Zero bits in signals[0,8] mark positions shared by both
  # Values; properties[1] carries the reduced self-knowledge metric in-band.
  # The kernel XOR-folds the 16-word srcA into 4 lanes, then sweeps 16
  # rotations against the cyclic srcB span; the 64-byte LSH result is
  # XOR-accumulated into signals[0,8], then OR-reduced into properties[1].
  unsupervised_learn: |
    asset[0,16]  asset[16,16] signals[0,8]    xor accumulate
    signals[0,8] signals[0,8] properties[1,1] or  reduce

  # Community label-energy fingerprint: the orchestrator stages up to 8
  # community member label words (w48) into asset[0,8] before dispatch.
  # The OR sweep produces a 64-byte LSH signature; reduce writes its
  # popcount into signals[7]. Higher popcount → more label bits set across
  # the community → more crystallisation energy. The resident loops via
  # next self; the orchestrator reads signals[7] each cycle to steer the
  # community eigenmode and check the global crystallisation floor.
  measure_field: |
    asset[0,8] asset[0,8] signals[7,1] or reduce
    next self
