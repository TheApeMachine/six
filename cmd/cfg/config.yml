loglevel: trace
telemetry:
  enabled: true
  ws_url: ws://127.0.0.1:3000/ws
logging:
  logfile: false
  trace:
    path: ''
  elasticsearch:
    enabled: true
    urls:
    - https://127.0.0.1:9200
    index: six-logs
    username: elastic
    password: ''
    api_key: ''
    ca_cert: ''
    insecure_skip_verify: true
system:
  projectRoot: /Users/theapemachine/go/src/github.com/theapemachine/six
  batchSize: 10000
  batchWindow: 500
  queueSize: 20000
  shannonLimit: 0.47
  resonanceThreshold: 0.6
  beliefEpsilon: 0.05
  routeBudget: 128
  maxMembersPerField: 256
  quiescenceTimeout: 100ms
  drainTimeout: 100ms
value:
  word: 64
  words: 128
  bytes: 1024
  num_rotations: 16
  region:
    tokens:
      start: 0
      bits: 1024
    program:
      start: 16
      bits: 1024
    signals:
      start: 32
      bits: 512
    context:
      start: 40
      bits: 512
    gradient:
      start: 48
      bits: 512
    properties:
      start: 56
      bits: 1024
    asset:
      start: 72
      bits: 3072
    prev:
      start: 120
      bits: 64
    next:
      start: 121
      bits: 64
    id:
      start: 122
      bits: 64
    affinity:
      start: 123
      bits: 257
  opcodes:
    false: 0
    and: 1
    aandnotb: 8
    a: 9
    notandb: 64
    b: 65
    xor: 72
    or: 73
    nor: 1000
    xnor: 1001
    notb: 1010
    ifbthena: 1011
    nota: 1100
    ifathenb: 1101
    nand: 1110
    true: 1111
  properties:
    - LABELS
    - CONFIDENCE
    - EPOCH
    - TTL
    - TEMPERATURE
    - STATUS
    - NOISE
    - PROGRAM_ID
    - COMMUNITY
    - TARGET
    - ROLE
    - REFERENCE
    - SURPRISAL
    - PREV_SURPRISAL
    - DELTA_SURPRISAL
    - CONTINUATION
  roles:
    - None
    - Programmer
    - Learner
    - Readout
    - Association
    - Prompt
  status:
    - PENDING
    - READY
    - BUSY
    - WAITING
    - DONE
    - RESOLVED
    - ERROR
programs:
  link: |
    program link {
      write A.prev <- or(A.prev, A.asset[0,1])
      write A.next <- or(A.next, A.asset[1,1])
      write A.properties.continuation <- or(A.properties.continuation, A.id)
    }

  affinity: |
    program affinity {
      write A.affinity[0,5] <- xor(A.affinity[0,5], A.tokens[0,16])
    }

  query: |
    program query {
      write B.properties.reference <- xor(B.properties.reference, A.id)
    }

  structural_component: |
    program structural_component {
      emit child {
        set child.signals <- B.signals
      }

      set A.properties.status <- DONE

      target B {
        write B.tokens <- xor(B.tokens, B.signals[2,1])
        write B.tokens <- xor(B.tokens, B.signals[1,1])
        write B.tokens <- xor(B.tokens, B.signals[0,1])
      }

      emit child {
        set child.prev <- B.id
        set child.next <- B.id
      }
    }

  beam_swarm_step: |
    program beam_swarm_step {
      set A.signals[0,8] <- 0
      write A.signals[0,8] <- xor(A.signals[0,8], A.tokens[0,8])
      write A.signals[0,8] <- xor(A.signals[0,8], A.context[0,8])
      write A.gradient[0,8] <- xor(A.gradient[0,8], A.signals[0,8])
      set A.properties.confidence <- popcnt(A.signals[0,8])

      emit child {
        set child.context[0,8] <- A.context[0,8]
        set child.gradient[0,8] <- A.gradient[0,8]
        set child.prev <- A.id
        set child.properties.continuation <- B.id
      }
    }

  surprisal: |
    program surprisal {
      set A.properties.prev_surprisal <- A.properties.surprisal
      set A.signals[0,8] <- 0
      write A.signals[0,8] <- xor(A.signals[0,8], A.tokens[0,8])
      write A.signals[0,8] <- xor(A.signals[0,8], A.context[0,8])
      write A.gradient[0,8] <- xor(A.gradient[0,8], A.signals[0,8])
      set A.properties.surprisal <- popcnt(A.signals[0,8])
      set A.properties.delta_surprisal <- 0
      write A.properties.delta_surprisal <- xor(A.properties.delta_surprisal, A.properties.prev_surprisal)
      write A.properties.delta_surprisal <- xor(A.properties.delta_surprisal, A.properties.surprisal)
      set A.properties.continuation <- A.id
    }

  hypothesis: |
    program hypothesis {
      set A.properties.noise <- 0
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.gradient[0,8])
      set A.properties.target <- popcnt(A.signals[0,8])
      write A.properties.target <- or(A.properties.target, A.id)

      when A.properties.target != 0 {
        set A.properties.reference <- A.id
        set A.properties.continuation <- A.id
      }

      emit child {
        set child.context[0,8] <- A.context[0,8]
        set child.gradient[0,8] <- A.gradient[0,8]
        set child.properties.target <- A.properties.target
        set child.properties.reference <- A.properties.reference
        set child.prev <- A.id
        set child.properties.ttl <- A.properties.ttl
        set child.properties.continuation <- A.id
      }
    }

  falsification: |
    program falsification {
      set A.properties.noise <- 0
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.asset[8,8])
      set A.properties.noise <- any_zero(A.signals[0,8])

      when A.properties.noise != 0 {
        write A.properties.reference <- or(A.properties.reference, A.asset[33,1])
        set A.properties.continuation <- A.id
      }

      when A.properties.noise == 0 {
        set A.properties.continuation <- 0
      }
    }

  memory_prune: |
    program memory_prune {
      when A.properties.noise != 0 {
        write A.properties.confidence <- and_not(A.properties.confidence, A.properties.noise)
      }

      when A.properties.noise == 0 {
        write A.properties.confidence <- or(A.properties.confidence, A.signals[0,1])
      }

      when A.properties.ttl != 0 {
        set A.properties.continuation <- A.id
      }

      when A.properties.ttl == 0 {
        set A.properties.continuation <- 0
      }
    }

  active_inference: |
    program active_inference {
      set A.properties.prev_surprisal <- A.properties.surprisal
      set A.signals[0,8] <- 0
      write A.signals[0,8] <- xor(A.signals[0,8], A.tokens[0,8])
      write A.signals[0,8] <- xor(A.signals[0,8], A.context[0,8])
      write A.gradient[0,8] <- xor(A.gradient[0,8], A.signals[0,8])
      set A.properties.surprisal <- popcnt(A.signals[0,8])
      set A.properties.delta_surprisal <- 0
      write A.properties.delta_surprisal <- xor(A.properties.delta_surprisal, A.properties.prev_surprisal)
      write A.properties.delta_surprisal <- xor(A.properties.delta_surprisal, A.properties.surprisal)

      when A.properties.surprisal != 0 {
        write A.context[0,8] <- xor(A.context[0,8], A.gradient[0,8])
        set A.properties.continuation <- A.id
      }

      when A.properties.surprisal == 0 {
        set A.properties.status <- DONE
        set A.properties.continuation <- 0
      }
    }

  program_select: |
    program program_select {
      set B.properties.continuation <- 0
      set B.properties.program_id <- 0

      when B.properties.ttl != 0 {
        set B.properties.program_id <- 5
      }

      when B.properties.surprisal != 0 {
        set B.properties.program_id <- 1
      }

      when B.properties.delta_surprisal != 0 {
        set B.properties.program_id <- 2
      }

      when B.properties.delta_surprisal == 0 {
        set B.properties.program_id <- 3
      }

      when B.properties.surprisal == 0 {
        set B.properties.program_id <- 0
      }

      when B.properties.target != 0 {
        set B.properties.program_id <- 4
      }

      when B.properties.noise != 0 {
        set B.properties.program_id <- 6
      }

      when B.asset[16,1] != 0 {
        set B.properties.program_id <- 7
      }

      when B.asset[24,1] != 0 {
        set B.properties.program_id <- 9
      }

      when B.properties.labels != 0 {
        set B.properties.program_id <- 10
      }

      when B.properties.community == 0 {
        set B.properties.program_id <- 8
      }

      when B.properties.program_id != 0 {
        set B.properties.continuation <- B.id
      }
    }

  program_carrier: |
    program program_carrier {
      set B.signals[0,1] <- B.properties.program_id
      write B.signals[0,1] <- xor(B.signals[0,1], A.properties.program_id)

      when B.signals[0,1] == 0 {
        set B.properties.continuation <- B.id
        set B.properties.status <- 1
        set B.program[0,16] <- A.asset[0,16]
      }
    }

  causal_explore: |
    program causal_explore {
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.gradient[0,8])
      set A.properties.surprisal <- popcnt(A.signals[0,8])
      set A.properties.noise <- any_zero(A.signals[0,8])

      when A.properties.surprisal != 0 {
        write A.context[0,8] <- xor(A.context[0,8], A.gradient[0,8])
      }

      when A.properties.ttl != 0 {
        set A.properties.continuation <- A.id
      }

      when A.properties.ttl == 0 {
        set A.properties.continuation <- 0
      }

      emit child {
        set child.context[0,8] <- A.context[0,8]
        set child.gradient[0,8] <- A.gradient[0,8]
        set child.properties.target <- A.properties.target
        set child.properties.reference <- A.properties.reference
        set child.prev <- A.id
        set child.properties.ttl <- A.properties.ttl
        set child.properties.continuation <- A.id
      }
    }

  recruit_community: |
    program recruit_community {
      mask popcnt(A.affinity) < 120

      target B where hamming(A.affinity, B.affinity) < 64 {
        when B.properties.community == 0 {
          write A.affinity <- or(A.affinity, B.affinity)
          set B.properties.status <- DONE
          set B.properties.community <- A.id
        }
      }

      set A.properties.confidence <- popcnt(A.affinity[0,1])
      set A.properties.community <- A.id

      emit child {
        set child.program <- A.program
        set child.properties.status <- DONE
      }
    }

  causal_hub: |
    program causal_hub {
      set A.properties.prev_surprisal <- A.properties.surprisal
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.asset[8,8])
      set A.properties.confidence <- popcnt(A.signals[0,8])
      set A.properties.surprisal <- popcnt(A.signals[0,8])
      set A.properties.delta_surprisal <- 0
      write A.properties.delta_surprisal <- xor(A.properties.delta_surprisal, A.properties.prev_surprisal)
      write A.properties.delta_surprisal <- xor(A.properties.delta_surprisal, A.properties.surprisal)

      when A.properties.noise != 0 {
        write A.gradient[0,8] <- xor(A.gradient[0,8], A.signals[0,8])
        set A.properties.target <- 0
      }

      when A.properties.delta_surprisal != 0 {
        set A.properties.continuation <- A.id
      }

      when A.properties.delta_surprisal == 0 {
        set A.properties.noise <- 0
        set A.properties.continuation <- 0
      }
    }

  open_ended_generation: |
    program open_ended_generation {
      write A.tokens[0,8] <- xor(A.tokens[0,8], A.gradient[0,8])
      write A.signals[0,8] <- truth_arrow(A.signals[0,8], A.context[0,8])
      set A.properties.noise <- any_zero(A.signals[0,8])

      when A.properties.noise != 0 {
        set A.properties.continuation <- 0
      }

      emit child {
        set child.tokens[0,16] <- A.tokens[0,16]
        set child.context[0,8] <- A.context[0,8]
        set child.prev <- A.id
      }
    }

  survey_community: |
    program survey_community {
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.asset[8,8])
      set A.properties.confidence <- popcnt(A.signals[0,8])

      when A.asset[24,1] != 0 {
        write A.properties.labels <- or(A.properties.labels, A.asset[24,1])
      }

      when A.properties.labels == 0 {
        set A.properties.continuation <- A.id
      }

      when A.properties.labels != 0 {
        set A.properties.status <- DONE
        set A.properties.continuation <- 0
      }
    }

  classify_readout: |
    program classify_readout {
      when A.asset[24,1] != 0 {
        write A.properties.labels <- or(A.properties.labels, A.asset[24,1])
      }

      when A.properties.labels == 0 {
        set A.properties.continuation <- A.id
      }

      when A.properties.labels != 0 {
        set A.properties.status <- DONE
        set A.properties.continuation <- 0
      }
    }

  episodic_replay: |
    program episodic_replay {
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.asset[8,8])
      write A.gradient[0,8] <- xor(A.gradient[0,8], A.signals[0,8])
      set A.properties.confidence <- popcnt(A.signals[0,8])

      when A.properties.confidence == 0 {
        set A.properties.continuation <- 0
      }

      when A.properties.confidence != 0 {
        set A.properties.continuation <- A.id
      }
    }

  intervene: |
    program intervene {
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.asset[16,8])
      set A.properties.surprisal <- popcnt(A.signals[0,8])
      write A.gradient[0,8] <- xor(A.gradient[0,8], A.asset[16,8])
      write A.properties.target <- or(A.properties.target, A.id)

      when A.prev == 0 {
        set A.properties.reference <- A.id
        set A.properties.continuation <- A.id
      }

      emit child {
        set child.context[0,8] <- A.context[0,8]
        set child.gradient[0,8] <- A.gradient[0,8]
        set child.properties.target <- A.properties.target
        set child.properties.reference <- A.properties.reference
        set child.prev <- A.id
        set child.properties.ttl <- A.properties.ttl
        set child.properties.continuation <- A.id
      }
    }

  vote_swarm: |
    program vote_swarm {
      set A.signals[0,8] <- A.context[0,8]
      write A.signals[0,8] <- xor(A.signals[0,8], A.asset[0,8])
      set A.properties.confidence <- popcnt(A.signals[0,8])

      when A.asset[24,1] != 0 {
        write A.properties.labels <- or(A.properties.labels, A.asset[24,1])
      }

      when A.properties.labels == 0 {
        set A.properties.continuation <- A.id
      }

      when A.properties.labels != 0 {
        set A.properties.status <- DONE
        set A.properties.continuation <- 0
      }
    }
