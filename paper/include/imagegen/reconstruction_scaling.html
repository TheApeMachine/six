<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>CIFAR-10 Reconstruction — Occlusion Scaling Curve</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
         
        @page {
            size: 1200px 800px;
            margin: 0;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 800px;
            overflow: hidden;
            background: transparent;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #0f172a;
        }
        #chart {
            width: 1200px;
            height: 800px;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        const xAxisData = ["10%","20%","30%","40%","50%","60%","70%","80%","90%"];
        const seriesData = [{"name":"Exact","data":[0,0,0,0,0,0,0,0,0]},{"name":"Partial","data":[0.07904645476772619,0.06423687423687414,0.06479641693811072,0.058876678876678766,0.052080078125,0.03864875864875865,0.03583188001395187,0.033241758241758214,0.02586272381985891]},{"name":"Fuzzy","data":[0.022090119430269478,0.03389797247669142,0.04934875228186054,0.058876678876678766,0.052080078125,0.03864875864875865,0.03583188001395187,0.033241758241758214,0.02586272381985891]},{"name":"Weighted","data":[0.02557450937851978,0.023682415242182335,0.026644250488913904,0.026762126762126744,0.023672762784090907,0.01756761756761758,0.016287218188159935,0.015109890109890105,0.011755783554481328]}];
        const yMin = 0;
        const yMax = 1;
        const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'svg' });

        const palette = ['#2563eb','#059669','#64748b','#dc2626','#7c3aed','#d97706'];

        const option = {
            backgroundColor: 'transparent',
            animation: false,
            tooltip: { trigger: 'axis' },
            legend: { top: '5%', textStyle: { color: '#475569', fontSize: 12 } },
            grid: { left: '10%', right: '10%', top: '20%', bottom: '15%' },
            xAxis: {
                type: 'category',
                data: xAxisData,
                axisLabel: { color: '#475569' },
                nameLocation: 'middle',
                nameGap: 30
            },
            yAxis: {
                type: 'value',
                min: yMin,
                max: yMax,
                axisLabel: { color: '#475569' },
                splitLine: { show: true, lineStyle: { color: '#e2e8f0', type: 'dashed' } }
            },
            series: seriesData.map((s, i) => {
                const color = palette[i % palette.length];
                return {
                    name: s.name,
                    type: 'line',
                    data: s.data,
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { color, width: 2 },
                    itemStyle: { color }
                };
            })
        };
        chart.setOption(option);


    </script>
</body>
</html>
