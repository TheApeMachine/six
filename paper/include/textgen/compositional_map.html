                            name: s.name,
                            type: 'line',
                            xAxisIndex: pi * 2,
                            yAxisIndex: pi * 2,
                            data: s.data,
                            smooth: false,
                            symbol: s.symbol || 'circle',
                            symbolSize: 4,
                            lineStyle: { color, type: 'dotted', width: 2 },
                            itemStyle: { color }
                        });
                    } else {
                        // smooth line (default)
                        const base = {
                            name: s.name,
                            type: 'line',
                            xAxisIndex: pi * 2,
                            yAxisIndex: pi * 2,
                            data: s.data,
                            smooth: true,
                            symbol: s.symbol || 'none',
                            symbolSize: 4,
                            lineStyle: { color, width: 2 },
                            itemStyle: { color }
                        };
                        if (s.area) base.areaStyle = { opacity: 0.1, origin: 0, color };
                        series.push(base);
                    }
                });
            }
        });

        chart.setOption({
            backgroundColor: 'transparent',
            animation: false,
            tooltip:  { position: 'top' },
            title:    titles,
            grid:     grids,
            xAxis:    xAxes,
            yAxis:    yAxes,
            series:   series,
            visualMap: visualMaps,
            legend: {
                data: legendItems,
                selectedMode: false,
                top:   '1%',
                right: '2%',
                textStyle: { color: '#475569', fontSize: 11 }
            }
        });

    </script>
</body>
</html>
