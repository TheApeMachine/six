<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Six — System Visualization</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0f; color:#c8ccd0; font-family:'SF Mono','Fira Code',monospace; font-size:12px; overflow:hidden; }
#canvas { position:fixed; top:0; left:0; width:100%; height:100%; }

/* HUD overlay */
#hud { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
#hud > * { pointer-events:auto; }

/* Top bar */
#topbar { display:flex; align-items:center; gap:12px; padding:8px 16px; background:rgba(10,10,15,0.85); border-bottom:1px solid #1a1a2e; backdrop-filter:blur(8px); }
#topbar .title { font-size:14px; font-weight:600; color:#7c8aff; letter-spacing:1px; }
#topbar .stat { color:#606878; }
#topbar .stat b { color:#8892a0; }
.btn { background:#1a1a2e; border:1px solid #2a2a3e; color:#8892a0; padding:4px 12px; cursor:pointer; font-family:inherit; font-size:11px; border-radius:3px; }
.btn:hover { background:#2a2a3e; color:#c8ccd0; }
.btn.active { background:#2a3a6e; border-color:#4a5aae; color:#a0aaff; }

/* Timeline */
#timeline { position:fixed; bottom:0; left:0; right:0; background:rgba(10,10,15,0.9); border-top:1px solid #1a1a2e; padding:6px 16px; backdrop-filter:blur(8px); display:flex; align-items:center; gap:12px; }
#timeline-bar { flex:1; height:24px; background:#111118; border-radius:3px; position:relative; cursor:pointer; }
#timeline-fill { height:100%; background:linear-gradient(90deg,#1a2a5e,#3a4a8e); border-radius:3px; position:absolute; left:0; top:0; transition:width 0.1s; }
#timeline-cursor { position:absolute; top:-2px; width:2px; height:28px; background:#7c8aff; border-radius:1px; pointer-events:none; }
#timeline-label { color:#606878; min-width:80px; text-align:right; font-variant-numeric:tabular-nums; }

/* Inspector panel */
#inspector { position:fixed; top:44px; right:0; width:340px; max-height:calc(100vh - 80px); background:rgba(10,10,15,0.92); border-left:1px solid #1a1a2e; backdrop-filter:blur(8px); overflow-y:auto; display:none; }
#inspector.open { display:block; }
#inspector-header { padding:10px 14px; border-bottom:1px solid #1a1a2e; display:flex; justify-content:space-between; align-items:center; }
#inspector-header h3 { font-size:13px; color:#7c8aff; font-weight:500; }
#inspector-body { padding:10px 14px; }
.insp-section { margin-bottom:12px; }
.insp-section h4 { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#4a5060; margin-bottom:6px; }
.insp-row { display:flex; justify-content:space-between; padding:2px 0; }
.insp-key { color:#606878; }
.insp-val { color:#a0aaff; font-variant-numeric:tabular-nums; }

/* Prompt panel */
#prompt-panel { position:fixed; bottom:42px; left:50%; transform:translateX(-50%); width:600px; max-width:90vw; background:rgba(10,10,15,0.92); border:1px solid #1a1a2e; border-radius:6px; padding:12px; display:none; backdrop-filter:blur(8px); }
#prompt-panel.open { display:block; }
#prompt-input { width:100%; background:#111118; border:1px solid #2a2a3e; color:#c8ccd0; padding:8px 12px; font-family:inherit; font-size:12px; border-radius:3px; outline:none; }
#prompt-input:focus { border-color:#4a5aae; }
#prompt-result { margin-top:8px; max-height:200px; overflow-y:auto; white-space:pre-wrap; color:#8892a0; font-size:11px; }

/* Event log */
#eventlog { position:fixed; top:44px; left:0; width:320px; max-height:calc(100vh - 80px); background:rgba(10,10,15,0.88); border-right:1px solid #1a1a2e; backdrop-filter:blur(8px); overflow-y:auto; display:none; font-size:11px; }
#eventlog.open { display:block; }
.log-entry { padding:3px 10px; border-bottom:1px solid #0e0e16; }
.log-entry .log-time { color:#3a3a4e; margin-right:6px; }
.log-entry .log-kind { color:#5a6a8e; margin-right:6px; font-weight:600; }
.log-entry .log-src { color:#4a8a6a; }

/* Legend */
#legend { position:fixed; top:50px; left:50%; transform:translateX(-50%); background:rgba(10,10,15,0.85); border:1px solid #1a1a2e; border-radius:4px; padding:6px 12px; display:flex; gap:16px; font-size:10px; }
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-dot { width:8px; height:8px; border-radius:50%; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <div id="topbar">
    <span class="title">SIX</span>
    <span class="stat">Nodes: <b id="stat-nodes">0</b></span>
    <span class="stat">Edges: <b id="stat-edges">0</b></span>
    <span class="stat">Events: <b id="stat-events">0</b></span>
    <span class="stat">Dropped: <b id="stat-dropped">0</b></span>
    <span class="stat">FPS: <b id="stat-fps">0</b></span>
    <div style="flex:1"></div>
    <button class="btn" id="btn-log">Log</button>
    <button class="btn" id="btn-prompt">Prompt</button>
    <button class="btn" id="btn-pause">⏸ Pause</button>
    <button class="btn" id="btn-save">Save</button>
    <button class="btn" id="btn-load">Load</button>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4a7aff"></div> Kadabra Node</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff6a4a"></div> High Surprisal</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4aff8a"></div> Low Surprisal</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffa04a"></div> Dominant Mode</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8a4aff"></div> Gossip</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff4a8a"></div> Data Flow</div>
  </div>

  <div id="inspector">
    <div id="inspector-header"><h3 id="inspector-title">Inspector</h3><button class="btn" id="btn-close-inspector">✕</button></div>
    <div id="inspector-body"></div>
  </div>

  <div id="eventlog"></div>

  <div id="prompt-panel">
    <input id="prompt-input" placeholder="Enter prompt to inject into the system..." />
    <div id="prompt-result"></div>
  </div>

  <div id="timeline">
    <button class="btn" id="btn-tl-start">⏮</button>
    <div id="timeline-bar">
      <div id="timeline-fill"></div>
      <div id="timeline-cursor"></div>
    </div>
    <span id="timeline-label">0 / 0</span>
    <button class="btn" id="btn-tl-end">⏭</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
